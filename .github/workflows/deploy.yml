name: Deploy to Neocities and Nekoweb

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: Uncomment the lines below if you use a static site generator (e.g., Astro, 11ty, Vite)
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - name: Install & Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: "site"    # Change to "dist" or "public" if using a build step
          cleanup: true

      - name: Deploy to Nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with:
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-username: "super-study"
          nekoweb-domain: "super-study.nekoweb.org"
          directory: "site"   # Change to "dist" or "public" if using a build step
